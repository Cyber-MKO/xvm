# Example host profile for a Windows host running the Wazuh agent.
# Format: docs/host-profiles.md. Values are examples, not captured from a
# real host. Replace them with values from the golden baseline VM.

schema = 1

[host]
name = "WIN-XVM-EXAMPLE"
os = "windows"

[windows]
# Host directory behind each drive, relative to this file.
drives = { C = "example-windows/c" }

# Where emulated system DLLs report they were loaded from. Example value;
# take the real one from the golden VM.
system_module_directory = 'C:\Windows\SysWOW64'

[windows.agent]
# The service's command line, as the Service Control Manager starts it.
command_line = '"C:\Program Files (x86)\ossec-agent\wazuh-agent.exe"'
# Services start in the system directory.
current_directory = 'C:\Windows\system32'
# The agent's process ID. Example value; Windows IDs are multiples of 4.
pid = 4812
# The Service Control Manager starts the agent as this service.
service = 'WazuhSvc'

# Files whose signature is valid on this host, as SHA-256. These are the
# executables of wazuh-agent-4.14.2-1.msi at their install paths; the MSI
# installer step will write this list.
[windows.trusted_files]
'C:\Program Files (x86)\ossec-agent\active-response\bin\netsh.exe' = '3dcb9567b2405ce0360f71273e91292023d2c71eceaaa70bda04c6885e5a85a9'
