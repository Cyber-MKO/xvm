# Example host profile: only what differs from the base.
schema: 1
kind: host-profile
name: win-web-01
base: windows-example
os: windows
identity:
  hostname: WIN-WEB-01
  domain: WORKGROUP
hardware:
  memory_mb: 8192
network:
  interfaces:
    - name: Ethernet0
      guid: "{00000000-0000-4000-8000-000000000101}"
      mac: "02:00:00:00:01:01"
      ipv4: [192.0.2.11/24]
      gateway: 192.0.2.1
      dns: [192.0.2.53]
      dhcp: false
users:
  - {name: Guest, remove: true}
  - {name: webadmin, sid: S-1-5-21-1000000000-1000000000-1000000000-1001, enabled: true, groups: [Administrators]}
software:
  - {name: Example Web Server, version: "2.4.1", vendor: Example Corp, architecture: x86_64}
services:
  - {name: W32Time, state: stopped}
  - {name: ExampleWeb, display_name: Example Web Server, state: running, start_mode: auto}
registry:
  keys:
    HKLM\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName:
      ComputerName: {type: REG_SZ, data: WIN-WEB-01}
    # TCP/IP settings of the adapter, under its GUID.
    HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\{00000000-0000-4000-8000-000000000101}:
      EnableDHCP: {type: REG_DWORD, data: 0}
      IPAddress: {type: REG_MULTI_SZ, data: [192.0.2.11]}
      SubnetMask: {type: REG_MULTI_SZ, data: [255.255.255.0]}
      DefaultGateway: {type: REG_MULTI_SZ, data: [192.0.2.1]}
      NameServer: {type: REG_SZ, data: 192.0.2.53}
agent:
  product: wazuh
  version: 4.14.2
  manager: manager.example.invalid
  group: web
  # How the agent is started. The personality registers it with the engine under pid.
  pid: 4812
  command_line: '"C:\Program Files (x86)\ossec-agent\wazuh-agent.exe"'
  current_directory: C:\Windows\system32
  service: WazuhSvc
  # A 32-bit service running as LocalSystem on 64-bit Windows.
  environment:
    ALLUSERSPROFILE: 'C:\ProgramData'
    APPDATA: 'C:\Windows\system32\config\systemprofile\AppData\Roaming'
    CommonProgramFiles: 'C:\Program Files (x86)\Common Files'
    CommonProgramW6432: 'C:\Program Files\Common Files'
    COMPUTERNAME: 'WIN-WEB-01'
    ComSpec: 'C:\Windows\system32\cmd.exe'
    LOCALAPPDATA: 'C:\Windows\system32\config\systemprofile\AppData\Local'
    NUMBER_OF_PROCESSORS: '2'
    OS: 'Windows_NT'
    Path: 'C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\'
    PATHEXT: '.COM;.EXE;.BAT;.CMD;.VBS;.VBE;.JS;.JSE;.WSF;.WSH;.MSC'
    PROCESSOR_ARCHITECTURE: 'x86'
    PROCESSOR_ARCHITEW6432: 'AMD64'
    ProgramData: 'C:\ProgramData'
    ProgramFiles: 'C:\Program Files (x86)'
    ProgramW6432: 'C:\Program Files'
    PUBLIC: 'C:\Users\Public'
    SystemDrive: 'C:'
    SystemRoot: 'C:\Windows'
    TEMP: 'C:\Windows\TEMP'
    TMP: 'C:\Windows\TEMP'
    USERDOMAIN: 'WORKGROUP'
    USERNAME: 'WIN-WEB-01$'
    USERPROFILE: 'C:\Windows\system32\config\systemprofile'
    windir: 'C:\Windows'
windows:
  system_module_directory: C:\Windows\SysWOW64
  # A real host's ROOT store holds many more; the golden capture will list them.
  cert_stores:
    ROOT:
      - name: DigiCert Assured ID Root CA
        der: 
  # Executables of wazuh-agent-4.14.2-1.msi at their install paths. The MSI
  # installer step will write this list.
  trusted_files:
    'C:\Program Files (x86)\ossec-agent\active-response\bin\netsh.exe': "3dcb9567b2405ce0360f71273e91292023d2c71eceaaa70bda04c6885e5a85a9"
    'C:\Program Files (x86)\ossec-agent\active-response\bin\restart-wazuh.exe': "de09354dfb35f543be993a3615063afcfc1a894dcf598d815e73a17a12431779"
