name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install unpack and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            msitools wixl libarchive-tools rpm2cpio cpio clang lld llvm jq
      - name: Install package
        run: |
          uv venv
          uv pip install -e '.[dev]'
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Start a systemd user manager for the runner
        # xvm-host runs hosts as transient systemd units; this lets the tests
        # use a real systemd instead of only the stand-in.
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
      - name: Test
        run: uv run pytest -q -rs
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  rust:
    runs-on: ubuntu-24.04
    env:
      XVM_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      # The version in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: i686-unknown-linux-gnu
      - name: Install fixture tools and 32-bit libc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm gcc-multilib
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --target i686-unknown-linux-gnu -- -D warnings
      - run: cargo test
      - name: Test on i686 (the engine, and the loader running PE code)
        run: cargo test --target i686-unknown-linux-gnu
