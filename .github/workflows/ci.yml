name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install unpack and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            msitools wixl libarchive-tools rpm2cpio cpio clang lld llvm jq
      - name: Install package
        run: |
          uv venv
          uv pip install -e '.[dev]'
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Test the engine as a 32-bit build (the Windows personality is i686)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib
          rustup target add i686-unknown-linux-gnu
          cargo test -p xvm-engine --target i686-unknown-linux-gnu
