[project]
name = "xvm"
version = "0.0.1"
description = "Lightweight emulated hosts for SIEM agents: tooling and control plane"
requires-python = ">=3.11"
dependencies = ["pefile>=2024.8.26", "pyyaml>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
xvm-census = "xvm_census.cli:main"
xvm-golden = "xvm_golden.cli:main"
xvm-profile = "xvm_control.cli:main"
xvm-host = "xvm_control.hostcli:main"
xvm-scenario = "xvm_scenario.cli:main"
xvm-msi-install = "xvm_msi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "census/xvm_census",
    "scenarios/xvm_golden",
    "scenarios/xvm_scenario",
    "control/xvm_control",
    "personalities/windows/installer/xvm_msi",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["census", "scenarios", "control", "personalities/windows/installer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["xvm_census", "xvm_golden", "xvm_scenario", "xvm_control", "xvm_msi"]
