# Windows events the scenario actions write.
#
# Field names, order, and the constant values follow the public Microsoft Learn
# event reference ("4720(S): A user account was created" and its siblings, and
# the Service Control Manager event 7036). Nothing here comes from a Microsoft
# binary (CLAUDE.md rule 1).
#
# A value in {braces} is filled from host state or the action's parameters when
# the event is written. A field with no default must be filled, or the write
# fails. Data fields are written out in full, not merged from an anchor: YAML
# merge keys would move them to the front and change the field order. Check these against the golden capture once it exists: the fidelity
# diff, not this file, is the authority on what Windows writes.

security: &security
  provider: Microsoft-Windows-Security-Auditing
  provider_guid: "{54849625-5478-4994-A5BA-3E3B0328C30D}"
  channel: Security
  level: 0
  opcode: 0
  process: lsass.exe

