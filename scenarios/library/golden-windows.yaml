# The golden capture's scenario (scenarios/golden/windows/capture.ps1), step for
# step, so the fidelity diff can compare an emulated host with the real one.
# Steps are 10 s apart, the capture kit's default settle time.
schema: 1
kind: scenario
name: golden-windows
description: Mirror of the Windows golden capture scenario
os: windows
defaults:
  actor: Administrator
steps:
  - {at: 0s, name: marker_start, action: marker,
     params: {event_id: 900, source: xvm-golden, description: xvm golden scenario start}}
  - {at: 10s, name: user_create, action: user.create, params: {name: xvmgolden}}
  - {at: 20s, name: group_add, action: group.add,
     params: {user: xvmgolden, group: S-1-5-32-544}}
  - {at: 30s, name: failed_logon, action: logon.failed,
     params: {user: xvmgolden, count: 3, ip_address: 127.0.0.1}}
  - {at: 40s, name: group_remove, action: group.remove,
     params: {user: xvmgolden, group: S-1-5-32-544}}
  - {at: 50s, name: user_delete, action: user.delete, params: {name: xvmgolden}}
  - {at: 60s, name: service_restart, action: service.restart, params: {name: W32Time}}
  - {at: 70s, name: fim_folder, action: file.mkdir,
     params: {path: 'C:\xvm-golden-fim', exist_ok: true}}
  - {at: 70s, name: fim_create, action: file.write,
     params: {path: 'C:\xvm-golden-fim\golden.txt', text: "xvm golden v1\r\n"}}
  - {at: 73s, name: fim_modify, action: file.append,
     params: {path: 'C:\xvm-golden-fim\golden.txt', text: "xvm golden v2\r\n"}}
  - {at: 76s, name: fim_delete, action: file.delete, params: {path: 'C:\xvm-golden-fim\golden.txt'}}
  - {at: 86s, name: marker_end, action: marker,
     params: {event_id: 901, source: xvm-golden, description: xvm golden scenario end}}
