      X: {type: REG_SZ, data: gone}
    HKLM\SOFTWARE\Other:
      Keep: {type: REG_MULTI_SZ, data: [a, b]}
    HKLM\SYSTEM\CurrentControlSet\Services\EventLog\Security:
      MaxSize: {type: REG_DWORD, data: 4096}
    HKLM\SYSTEM\CurrentControlSet\Services\EventLog\System:
      MaxSize: {type: REG_DWORD, data: 20971520}
